spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/orders}
    username: ${SPRING_DATASOURCE_USERNAME:ecom}
    password: ${SPRING_DATASOURCE_PASSWORD:ecom}
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway e o dono do schema
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/orders/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

server:
  port: 8080
  shutdown: graceful              # nao mata requisicoes em andamento no deploy
  max-http-request-header-size: 16KB

ecom:
  http:
    max-request-body-bytes: 131072
  catalog:
    currency: BRL
    # Adapter confiavel temporario da Fase 1; sera substituido por PricingPort externo.
    prices:
      SKU-1: 10.00
      SKU-2: 4.00
      SKU-3: 25.50
  inventory:
    host: ${INVENTORY_HOST:localhost}
    port: ${INVENTORY_PORT:9091}
    deadline-ms: 1500
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
    fixed-delay-ms: 500
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
  saga:
    payment-expiration:
      fixed-delay-ms: ${PAYMENT_EXPIRATION_FIXED_DELAY_MS:60000}
  messaging:
    retention-days: ${MESSAGE_RETENTION_DAYS:30}
    cleanup-fixed-delay-ms: ${MESSAGE_CLEANUP_FIXED_DELAY_MS:3600000}

resilience4j:
  circuitbreaker:
    instances:
      inventoryGrpc:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      inventoryGrpc:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions:
          - com.ecom.order.domain.exception.InventoryUnavailableException
  timelimiter:
    instances:
      inventoryGrpc:
        timeout-duration: ${ecom.inventory.deadline-ms:1500}ms
        cancel-running-future: true


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /health/liveness e /health/readiness
      show-details: when_authorized
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  server:
    port: 9090
