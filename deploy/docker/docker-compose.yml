# Infra local da Fase 1: um Postgres por servico (database-per-service) + Redpanda.
# Sobe com:  docker compose -f deploy/docker/docker-compose.yml up -d
name: ecommerce-microservices

services:
  postgres-orders:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
    ports: ["5433:5432"]
    volumes: ["pg-orders:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
    ports: ["5434:5432"]
    volumes: ["pg-inventory:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-payments:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
    ports: ["5435:5432"]
    volumes: ["pg-payments:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.9
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports: ["8090:8080"]
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  pg-orders:
  pg-inventory:
  pg-payments:
